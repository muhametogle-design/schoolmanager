[project]
name = "schoolmanager"
version = "0.1.0"
description = "NE-ES School Management System backend (FastAPI + SQLAlchemy 2 + Pydantic v2)"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # comprehensions
  "SIM", # simplicity
  "RET", # return-statements
  "ARG", # unused arguments
  "PIE", # misc cleanliness
  "T20", # no print()
  "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
